name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.8"
  NODE_VERSION: "22"

jobs:
  python:
    name: Python (lint, types, unit + integration)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_USER: budbyte
          POSTGRES_PASSWORD: budbyte
          POSTGRES_DB: budbyte
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U budbyte" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      BUDBYTE_TEST_DATABASE_URL: postgresql://budbyte:budbyte@localhost:5432/budbyte
      BUDBYTE_TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --all-packages --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - name: Tests (unit + integration)
        run: uv run pytest -q --cov=budbyte_api --cov-report=term-missing

  web:
    name: Web (lint, types, build, Playwright smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm --filter @budbyte/web exec playwright install --with-deps chromium
      - name: Playwright smoke (builds the app, uses a mock API)
        run: pnpm --filter @budbyte/web test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  codegen:
    name: Generated client is up to date
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: uv sync --all-packages --frozen
      - run: pnpm install --frozen-lockfile
      - run: uv run budbyte-openapi packages/api-client/openapi.json
      - run: pnpm --filter @budbyte/api-client gen
      - name: Fail on drift
        run: git diff --exit-code -- packages/api-client || (echo "::error::Run 'just gen' and commit the result" && exit 1)

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/Dockerfile
          push: false
          tags: budbyte-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
