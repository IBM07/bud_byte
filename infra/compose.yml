# Local full stack. Requires Docker.
#   docker compose -f infra/compose.yml up --build
# Just dependencies (for running api/worker with `just dev`):
#   docker compose -f infra/compose.yml up db redis
name: budbyte

services:
  db:
    image: pgvector/pgvector:0.8.7-pg17
    environment:
      POSTGRES_USER: budbyte
      # Throwaway local-only password; override with LOCAL_PG_PASSWORD if you like.
      POSTGRES_PASSWORD: ${LOCAL_PG_PASSWORD:-budbyte}
      POSTGRES_DB: budbyte
    ports: ["5432:5432"]
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U budbyte"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api:
    build: { context: .., dockerfile: infra/Dockerfile }
    env_file: [../.env]
    environment:
      BUDBYTE_DATABASE_URL: postgresql://budbyte:${LOCAL_PG_PASSWORD:-budbyte}@db:5432/budbyte
      BUDBYTE_REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    build: { context: .., dockerfile: infra/Dockerfile }
    command: ["budbyte-worker"]
    env_file: [../.env]
    environment:
      BUDBYTE_DATABASE_URL: postgresql://budbyte:${LOCAL_PG_PASSWORD:-budbyte}@db:5432/budbyte
      BUDBYTE_REDIS_URL: redis://redis:6379/0
    depends_on:
      api: { condition: service_started }

volumes:
  db-data:
