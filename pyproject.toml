[project]
name = "budbyte-workspace"
version = "0.0.0"
description = "BudByte monorepo (uv workspace root; not a package)"
requires-python = ">=3.12"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["services/api"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "ruff>=0.8",
    "pyright>=1.1.390",
    "fakeredis>=2.26",
    "respx>=0.21",
    "asgi-lifespan>=2.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".claude", "node_modules", "apps", "packages"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF", "SIM", "PT", "N"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.isort]
known-first-party = ["budbyte_api"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S105", "S106"]
"**/alembic/**" = ["N999"]

[tool.pyright]
include = ["services/api/src", "services/api/tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["services/api/tests"]
markers = ["integration: needs real Postgres + Redis (DATABASE_URL / REDIS_URL)"]
