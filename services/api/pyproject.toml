[project]
name = "budbyte-api"
version = "0.1.0"
description = "BudByte backend: FastAPI api, worker and cron entrypoints"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "httpx>=0.28",
    "redis>=5.2",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "sentry-sdk[fastapi]>=2.19",
]

[project.scripts]
budbyte-api = "budbyte_api.cli:serve"
budbyte-worker = "budbyte_api.cli:worker"
budbyte-cron = "budbyte_api.cli:cron"
budbyte-openapi = "budbyte_api.cli:export_openapi"
budbyte-set-webhook = "budbyte_api.cli:set_webhook"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/budbyte_api"]
